server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: auren-backend
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

auren:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3e7b1a5f6e8d2c4b7a9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://auren.vercel.app}
