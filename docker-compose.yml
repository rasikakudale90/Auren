services:
  postgres:
    image: postgres:16-alpine
    container_name: auren-postgres
    environment:
      POSTGRES_DB: auren_db
      POSTGRES_USER: auren_user
      POSTGRES_PASSWORD: auren_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auren_user -d auren_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auren-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      SUPABASE_DB_URL: jdbc:postgresql://postgres:5432/auren_db
      SUPABASE_DB_USERNAME: auren_user
      SUPABASE_DB_PASSWORD: auren_secret_password
      JWT_SECRET: 9a4f2c8d3e7b1a5f6e8d2c4b7a9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e
      CORS_ALLOWED_ORIGINS: http://localhost:3000

volumes:
  postgres_data:
